services:
  - type: web
    name: radar-promocoes-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: radar-promocoes-db
          property: connectionString
      - key: ML_CLIENT_ID
        value: "5938730542536945"
      - key: ML_CLIENT_SECRET
        sync: false
      - key: ML_REDIRECT_URI
        value: https://api.radarpromocoesreais.com.br/auth/mercadolivre/callback
      - key: ML_OAUTH_USE_PKCE
        value: "true"
      - key: ML_SITE_ID
        value: MLB
      - key: MIN_DISCOUNT_PERCENT
        value: "15"
      - key: MAX_PRICE_BRL
        value: "1000"
      - key: MIN_RATING
        value: "4.5"
      - key: MONITOR_CRON
        value: "0 0 */3 * * *"

databases:
  - name: radar-promocoes-db
    plan: free
    databaseName: radar
    user: radar
